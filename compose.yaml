services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    # schema.sql chỉ chạy khi volume còn rỗng. Đổi schema thì phải
    # `docker compose down -v` rồi lên lại, hoặc chạy tay bằng psql.
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # postgres:18 muốn một mount duy nhất ở /var/lib/postgresql,
      # không phải .../data như các bản trước.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 5433 chứ không phải 5432: máy dev thường đã có Postgres cài sẵn giữ cổng đó.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/auth_db
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-False}
      JWT_SECRET: ${JWT_SECRET:-SECRET_KEY}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # uvicorn chỉ tin X-Forwarded-For khi peer nằm trong danh sách này.
      # Mặc định 127.0.0.1, nghĩa là header từ gateway của Docker bị bỏ qua và
      # mọi client gộp thành một IP. Đặt đúng địa chỉ proxy khi có proxy thật;
      # đừng bao giờ đặt "*".
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Dev console chạy ngoài container, cần được CORS cho qua.
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    build: ./dev
    depends_on:
      - api
    # Trình duyệt gọi API ở localhost:8000, không phải qua mạng nội bộ của
    # compose, nên console không cần biết hostname của service api.
    # Cổng host phải là 5173: CORS_ORIGINS của API chỉ cho 3000 và 5173.
    ports:
      - "5173:80"

volumes:
  pgdata:
