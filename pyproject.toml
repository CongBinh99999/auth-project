[project]
name = "auth-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PIE", "RUF"]
ignore = [
    "B008",    # FastAPI dùng Depends() làm default argument
    "E501",    # độ dài dòng: để formatter lo
    "E712",    # `Column == False` là cú pháp bắt buộc của SQLAlchemy
    "UP042",   # str+Enum: đổi sang StrEnum sẽ đổi hành vi cột SAEnum
    "RUF001", "RUF002", "RUF003",  # chuỗi tiếng Việt có dấu
]

[tool.ruff.lint.per-file-ignores]
# SQLModel resolve tên class trong Relationship lúc runtime; đổi Optional["X"] -> X | None
# sẽ làm mapper không tìm thấy class (vì X chỉ tồn tại trong TYPE_CHECKING).
"app/models/*.py" = ["UP045", "UP007", "UP037"]
