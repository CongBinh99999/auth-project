name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/auth_db
      JWT_SECRET: ci-only-not-a-real-secret
      APP_DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Load database schema
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -q -f database/schema.sql
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/auth_db

      - name: Lint
        run: uv run --frozen ruff check app tests

      - name: Test
        run: uv run --frozen pytest
